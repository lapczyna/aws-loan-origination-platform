{{- /*
Secrets Store CSI driver configuration.

Secrets are projected as FILES into the pod and read through a Spring config
tree. They are deliberately NOT synchronised into Kubernetes Secrets, and not
exposed as environment variables.

Why not a Kubernetes Secret: it is base64, not encryption. Anything with get
access in the namespace can read it, `kubectl describe` prints its keys, and by
default it sits unencrypted in etcd. Copying a Secrets Manager value into one
takes a secret that was protected by IAM and puts it somewhere protected by
namespace RBAC.

Why not an environment variable: it appears in the pod spec, in
`kubectl describe pod`, in /proc/<pid>/environ, and in any crash dump or error
report that captures the environment. A mounted file is readable only by the
process that opens it, and can be rotated without recreating the pod.

Every ARN below is built from a PLACEHOLDER account identifier. No real account,
ARN or secret name appears in this repository.
*/ -}}
{{- if .Values.secrets.enabled }}
{{- range $serviceName, $service := .Values.services }}
{{- $ctx := dict "root" $ "serviceName" $serviceName "service" $service }}
{{- /*
  Only the application service mounts anything now.

  The database password is gone: the aws profile authenticates to RDS with the
  pod's IAM role, so there is no database secret for any service to read. What
  remains is the applicant pepper, and only one service derives the pseudonym.
*/ -}}
{{- if eq $serviceName "application-service" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "los.fullname" $ctx }}-secrets
  labels:
    {{- include "los.labels" $ctx | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ $.Values.environment }}/los/applicant-reference-pepper"
        objectType: "secretsmanager"
        # Mounted at /etc/secrets/applicant-pepper. Read as a FILE, never as an
        # environment variable: those appear in /proc, in crash dumps and in
        # docker inspect.
        objectAlias: "applicant-pepper"
  # No secretObjects block. Its presence is what would sync this value into a
  # Kubernetes Secret, which is exactly what the comment above explains we do
  # not want.
{{- end }}
{{- end }}
{{- end }}
