{{- /*
One ServiceAccount per service, each carrying its own IAM role.

This is the single most important authorisation boundary in the deployment.
A shared service account would give every pod the union of all four services'
AWS permissions: the workflow service, which needs no S3 at all, would be able
to read every uploaded document, and a compromise of the least sensitive service
would yield the most sensitive service's access.

The annotation is a PLACEHOLDER. No real account identifier or ARN appears
anywhere in this repository.
*/ -}}
{{- range $serviceName, $service := .Values.services }}
{{- $ctx := dict "root" $ "serviceName" $serviceName "service" $service }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "los.serviceAccountName" $ctx }}
  labels:
    {{- include "los.labels" $ctx | nindent 4 }}
  {{- if $.Values.aws.podIdentity.enabled }}
  annotations:
    # EKS Pod Identity is preferred over IRSA where available: it removes the
    # OIDC provider trust relationship entirely, so a role cannot be assumed
    # from outside the cluster even if its trust policy is misconfigured.
    #
    # The association itself is created by Terraform, not here -- a Kubernetes
    # manifest that could grant itself an IAM role would defeat the separation.
    eks.amazonaws.com/role-arn: {{ printf "arn:aws:iam::%s:role/%s-%s" $.Values.aws.accountIdPlaceholder $.Values.environment $serviceName | quote }}
  {{- end }}
# Never true. A token this pod does not use is a credential handed to whatever
# compromises the container.
automountServiceAccountToken: false
{{- end }}
